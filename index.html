<!DOCTYPE html>
<html>
<head>
    <title>AGI Messenger | Jack & Julia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* iOS / Messenger Theme */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER */
        .header { background: #f6f6f6; border-bottom: 1px solid #d1d1d6; padding: 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; padding-top: 20px; }
        .contact-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #ddd; position: relative; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .name-box { display: flex; flex-direction: column; }
        .name { font-weight: 600; font-size: 1.1em; color: #000; }
        .status { font-size: 0.8em; color: #34c759; } /* Green for online */
        
        /* SWITCHER BUTTON */
        .switch-btn { color: #007aff; font-weight: bold; cursor: pointer; font-size: 0.9em; background: none; border: none; }

        /* CHAT AREA */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; background: #fff; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 75%; padding: 10px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; position: relative; animation: popIn 0.3s ease; }
        
        /* Message Styles */
        .msg-jack { align-self: flex-start; background: #e9e9eb; color: #000; border-bottom-left-radius: 5px; }
        .msg-julia { align-self: flex-start; background: #e9e9eb; color: #000; border-bottom-left-radius: 5px; }
        .msg-user { align-self: flex-end; background: #007aff; color: white; border-bottom-right-radius: 5px; }
        
        .sender-name { font-size: 0.7em; margin-bottom: 2px; color: #8e8e93; margin-left: 12px; }

        /* INPUT AREA */
        .input-bar { background: #f6f6f6; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #d1d1d6; }
        .text-field { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #d1d1d6; font-size: 16px; outline: none; }
        .send-btn { color: #007aff; font-weight: bold; font-size: 1em; border: none; background: none; cursor: pointer; }
        
        /* UPLOAD OVERLAY (Hidden input) */
        input[type="file"] { display: none; }
        .upload-trigger { font-size: 0.8em; color: #8e8e93; text-align: center; margin-top: 5px; cursor: pointer; }

        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="contact-info">
            <div class="avatar-circle" onclick="triggerUpload()">
                <img id="active-avatar" src="https://ui-avatars.com/api/?name=Jack&background=0D8ABC&color=fff">
            </div>
            <div class="name-box">
                <div class="name" id="agent-name">Jack</div>
                <div class="status">● Active</div>
            </div>
        </div>
        <button class="switch-btn" onclick="toggleAgent()">Switch to Julia ⇄</button>
    </div>

    <div id="chat-window">
        </div>

    <input type="file" id="upload-jack" accept="image/*" onchange="updatePhoto('Jack', this)">
    <input type="file" id="upload-julia" accept="image/*" onchange="updatePhoto('Julia', this)">

    <div class="input-bar">
        <input type="text" id="user-msg" class="text-field" placeholder="Message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="upload-trigger" onclick="triggerUpload()">Tap avatar to change photo</div>

    <script>
        // --- CONFIGURATION ---
        const BRAIN_URL = "https://agi-backend-final.onrender.com";
        
        // State
        let currentAgent = "Jack";
        let photos = {
            "Jack": "https://ui-avatars.com/api/?name=Jack&background=0D8ABC&color=fff",
            "Julia": "https://ui-avatars.com/api/?name=Julia&background=eb4034&color=fff"
        };

        // --- CORE FUNCTIONS ---

        function toggleAgent() {
            if (currentAgent === "Jack") {
                currentAgent = "Julia";
                document.querySelector('.switch-btn').innerText = "Switch to Jack ⇄";
                addSystemMsg("Julia has entered the chat.");
            } else {
                currentAgent = "Jack";
                document.querySelector('.switch-btn').innerText = "Switch to Julia ⇄";
                addSystemMsg("Jack is now active.");
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('agent-name').innerText = currentAgent;
            document.getElementById('active-avatar').src = photos[currentAgent];
        }

        function triggerUpload() {
            if (currentAgent === "Jack") document.getElementById('upload-jack').click();
            else document.getElementById('upload-julia').click();
        }

        function updatePhoto(agent, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photos[agent] = e.target.result; // Store base64 locally
                    updateUI(); // Refresh view
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.style.textAlign = "center";
            div.style.fontSize = "0.8em";
            div.style.color = "#8e8e93";
            div.style.margin = "10px 0";
            div.innerText = text;
            document.getElementById('chat-window').appendChild(div);
        }

        function addBubble(text, type) {
            const container = document.getElementById('chat-window');
            
            // Add Label if it's AI
            if (type !== 'user') {
                const label = document.createElement('div');
                label.className = 'sender-name';
                label.innerText = currentAgent;
                container.appendChild(label);
            }

            const bubble = document.createElement('div');
            bubble.className = `message msg-${type}`;
            bubble.innerText = text;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-msg');
            const text = input.value.trim();
            if (!text) return;

            addBubble(text, 'user');
            input.value = "";

            // Simulate Thinking
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'sender-name';
            typingIndicator.innerText = `${currentAgent} is typing...`;
            typingIndicator.id = 'typing';
            document.getElementById('chat-window').appendChild(typingIndicator);

            try {
                // Determine which part of the brain to query based on Agent Persona
                let endpoint = "/agi/assistant"; // Default
                if (currentAgent === "Jack") endpoint = "/admin/defense/war_room"; // Jack = Defense/Strategy
                if (currentAgent === "Julia") endpoint = "/agi/education"; // Julia = Education/Care

                const res = await fetch(BRAIN_URL + endpoint);
                const data = await res.json();
                
                document.getElementById('typing').remove();

                // Format Reply based on Persona
                let reply = "";
                if (currentAgent === "Jack") {
                    reply = `Strategy Update: Threat Level is ${data.threat_level || 'Unknown'}. Grid Integrity: ${data.grid_integrity || 'Stable'}.`;
                } else {
                    reply = `Hello. I've prepared a learning module on: ${data.subject || 'General Knowledge'}. Shall we begin?`;
                }
                
                addBubble(reply, currentAgent.toLowerCase());

            } catch (e) {
                document.getElementById('typing').remove();
                addBubble("I am having trouble connecting to the Neural Core. Please standby.", currentAgent.toLowerCase());
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Init
        addSystemMsg("Connection Established to AGI-1 Core.");
    </script>
</body>
</html>
